<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioVault</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0c29;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .c {
            width: 340px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #333;
            text-align: center;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            background: #00ff88;
            color: #003;
        }

        button:disabled {
            background: #555;
            color: #ccc;
            cursor: not-allowed;
        }

        #p,
        #s2,
        #s3,
        #sig {
            display: none;
        }

        .spin {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #sig {
            font-size: 10px;
            font-family: monospace;
            color: #00ff88;
            word-break: break-all;
            margin-top: 10px;
        }

        #m {
            margin-top: 12px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="c">

    <h3 id="h">Phase 1: Identity Verification</h3>

    <div id="p" style="font-size:11px;margin-bottom:12px;">
        ID:
        <span id="pn"></span>
        |
        Node:
        <span id="pc"></span>
    </div>

    <div id="s1">

        <input
            id="u"
            placeholder="Username"
        >

        <textarea
            id="k"
            placeholder="Paste ECC Public Key Here..."
        ></textarea>

        <button onclick="v1()">
            Verify Identity
        </button>

    </div>

    <div id="s2">

        <button onclick="cap()">
            Scan Fingerprint
        </button>

        <button
            id="vb"
            disabled
            onclick="v2()">
            Verify Match
        </button>

    </div>

    <div id="s3">

        <button
            onclick="v3()"
            style="background:#e67e22;color:white;">
            Sign & Enter Vault
        </button>

    </div>

    <div id="sig"></div>

    <div id="m"></div>

</div>

<script>

const $ = id => document.getElementById(id);

const post = (url, body) =>
    fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    });

let capturedData = "";
let publicKey = "";

function sw(step){

    ["s1","s2","s3"].forEach((id,index)=>{
        $(id).style.display = (index+1===step) ? "block" : "none";
    });

    $("h").innerText = "Phase " + step;
}

async function v1(){

    $("m").innerHTML = '<span class="spin"></span> Verifying...';

    try{

        const response = await post("/get_user_details",{
            username: $("u").value,
            public_key: $("k").value
        });

        const data = await response.json();

        if(data.status==="success"){

            publicKey = $("k").value;

            $("pn").innerText = data.name;
            $("pc").innerText = data.cloud_id;

            $("p").style.display="block";

            $("m").innerText="Identity Verified";

            sw(2);

        }else{

            $("m").innerText = "Verification Failed";

        }

    }catch(e){

        $("m").innerText = "Server Error";

    }

}

async function cap(){

    $("m").innerHTML='<span class="spin"></span> Capturing Fingerprint...';

    try{

        const response = await fetch(
            "http://127.0.0.1:11100/rd/capture",
            {
                method:"CAPTURE",
                body:`<PidOptions ver="1.0">
                        <Opts
                            fCount="1"
                            fType="2"
                            format="0"
                            pidVer="2.0"
                            timeout="10000"
                            env="P"/>
                      </PidOptions>`
            }
        );

        const xml = await response.text();

        const doc = new DOMParser().parseFromString(xml,"text/xml");

        const resp = doc.getElementsByTagName("Resp")[0];

        if(resp.getAttribute("errCode")==="0"){

            capturedData =
                doc.getElementsByTagName("Data")[0].textContent;

            $("vb").disabled=false;

            $("m").innerText="Fingerprint Captured";

        }else{

            $("m").innerText="Capture Failed";

        }

    }catch(e){

        $("m").innerText="Fingerprint Sensor Not Found";

    }

}

async function v2(){

    $("m").innerHTML='<span class="spin"></span> Matching...';

    const response = await post("/verify_match",{

        username:$("u").value,
        biometric_data:capturedData,
        public_key:publicKey

    });

    const data = await response.json();

    if(data.status==="Matched"){

        $("m").innerText="Fingerprint Matched";

        sw(3);

    }else{

        $("m").innerText="Fingerprint Not Matched";

    }

}

async function v3(){

    $("m").innerHTML='<span class="spin"></span> Verifying Signature...';

    const response = await post("/verify_ecdsa",{

        username:$("u").value

    });

    const data = await response.json();

    if(data.status==="Verified"){

        $("sig").style.display="block";

        $("sig").innerText=data.visual_signature;

        $("m").innerText="Vault Opened Successfully";

        setTimeout(()=>{

            location.href="/dashboard";

        },2000);

    }else{

        $("m").innerText="Signature Verification Failed";

    }

}

</script>

</body>
</html>
